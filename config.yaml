data:
  data_dir: "./data/chest_xray"
  img_size: 224
  batch_size: 32
  num_workers: 4

model:
  backbone: "densenet121"
  num_classes: 2
  dropout: 0.3

training:
  phase1_epochs: 5
  phase2_epochs: 15
  phase1_lr: 0.001
  phase2_lr: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 5
  seed: 42

evaluation:
  threshold: 0.5
  test_size: 650

paths:
  model_save: "./outputs/best_model.pth"
  curves: "./outputs/training_curves.png"
  roc: "./outputs/roc_curve.png"
  gradcam_dir: "./outputs/gradcam"